# Dependency updates
#
# Grouped rather than one PR per package. An unbatched Dependabot on a project
# with this many optional extras produces more PRs than commits, and a review
# queue nobody reads is the same as no updates at all.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      # Conventional Commits: `ci:` produces no release.
      prefix: "ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Two groups, split by blast radius. A patch bump to a dev tool is a
      # rubber stamp; a minor bump to numpy or scipy can move a decision
      # threshold, and those deserve to be read on their own.
      dev-tools:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      runtime-patches:
        dependency-type: "production"
        update-types: ["patch"]
    ignore:
      # torch is installed by the user with their own index URL, and
      # its wheels are large enough that CI churn is not worth it.
      - dependency-name: "torch"
    commit-message:
      prefix: "chore"
      include: "scope"
