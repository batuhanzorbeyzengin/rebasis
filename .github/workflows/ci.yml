# rebasis — continuous integration
#
# Runs on GitHub's free CPU runners, which have no accelerator. GPU work happens
# on the project's own host and is run by hand — the workflow that would put it
# on a schedule is not in this repository, and a `schedule:` trigger only fires
# from the default branch, so nothing runs that layer unattended.
# See docs/development/testing.md.
#
# Three jobs exist specifically to stop an optional dependency from quietly
# becoming mandatory. Without them, someone writes `import torch` at module
# level, every developer machine has torch, and the break only surfaces for a
# user who installed the core package.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default `GITHUB_TOKEN` is write-scoped unless a workflow says otherwise, so
# every job here would be able to push to this repository for no reason. Declared
# read-only at the top; the one job that needs more says so itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint and types
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # hatch-vcs derives the version from tags, which needs history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Distinct per job: parallel jobs sharing one key raced to
          # reserve it, and the losers logged a failed cache save.
          cache-suffix: lint
      - run: uv sync --no-group spike
      - name: ruff
        # The same paths the release workflow lints. They diverged once, and
        # the effect was that a lint failure in examples/ could not be seen
        # until the release job ran. `scripts/` used to be listed here too; it
        # is not in a clone, so ruff silently linted nothing for it.
        #
        # `tools/` is here because the pre-commit hook lints it and this did
        # not: `check_citations.py` runs in this very job, `bridge_band.py` is
        # what every published measurement comes out of, and a fork's pull
        # request never runs the hook. Exactly the divergence the paragraph
        # above describes, one directory over.
        run: |
          uv run ruff check src tests spikes examples tools
          uv run ruff format --check src tests spikes examples tools
      - name: mypy --strict
        run: uv run mypy src
      - name: import-linter
        run: uv run lint-imports
      - name: public API is documented
        # At the target the design names. `pyproject.toml` justified
        # skipping ruff's D105/D107 by saying interrogate covers it; interrogate
        # was in no dependency group, no hook and no job.
        run: uv run interrogate -c pyproject.toml src
      - name: generated catalogues are up to date
        # errors.md and events.md are generated. Regenerating and
        # diffing catches a new error code or event that was added without its
        # documentation, which belongs in the same PR.
        run: |
          uv run python -m rebasis.report.catalog --out docs/reference
          git diff --exit-code docs/reference || {
            echo "::error::docs/reference is stale. Run 'just docs-gen' and commit."
            exit 1
          }
      - name: every arXiv citation names its paper
        # The offline half: that `docs/citations.toml` and the committed
        # documentation name the same set of papers. It touches no network, so it
        # cannot go red because arXiv is down — which is the only reason a
        # citation check is safe to put on the merge path at all. Whether the
        # recorded titles are *true* is the weekly `citations` job's question.
        run: uv run python tools/check_citations.py

      - name: the release tooling can still work out a version
        # The release path used to resolve `python-semantic-release` fresh on
        # every run, outside `uv.lock`. GitPython 3.1.60 removed an attribute it
        # reads, and the release workflow broke on a repository where nothing had
        # changed — with no warning until somebody tried to cut a release. It is
        # in the lock now; this step makes the *upgrade* visible on the pull
        # request that proposes it rather than at the moment a release is wanted.
        #
        # **The branch dance is not optional.** On a pull request
        # `actions/checkout` leaves a detached HEAD at the merge commit, and
        # python-semantic-release refuses to match a release group in that state:
        # "Detached HEAD state cannot match any release groups". Pointing a local
        # `main` at that commit is not a workaround — the merge commit is exactly
        # what `main` would become, which is the state worth testing. On a push
        # to `main` HEAD is already on a branch and nothing happens.
        #
        # It is `version --print` and not `--version`, and that was measured
        # rather than assumed: against the broken GitPython, `--version` exits 0
        # and would have caught nothing, while `version --print` exits 1.
        run: |
          git symbolic-ref -q HEAD >/dev/null || {
            git branch -f main HEAD
            git switch -q main
          }
          version=$(uv run --group release semantic-release version --print)
          tag=$(uv run --group release semantic-release version --print-tag)
          if [ -z "$version" ] || [ -z "$tag" ]; then
            echo "::error::the release tooling printed no version"
            exit 1
          fi
          echo "next release would be $version ($tag)"

  # The only job that runs the suite. It was two — a `tests` job and this one
  # — running very nearly the same tests twice, for fourteen minutes of runner
  # time and one extra thing to go red. This is the wider selection of the two,
  # so nothing is lost by keeping it and dropping the other.
  coverage:
    name: tests and coverage floors
    timeout-minutes: 25
    runs-on: ubuntu-latest
    # The one backend that needs something outside the process. Five of the six
    # stores are a file or an embedded library; pgvector is the store most teams
    # actually run, and it is a server. Without this the pgvector layer would
    # skip here — and a suite that skips a backend reports the same green
    # summary as one that ran it, which is how this suite once claimed to cover
    # five stores it had never opened.
    #
    # Pinned by digest for the same reason every `uses:` above it is pinned by
    # SHA: a tag is a name somebody else can repoint. `0.8.6-pg16` at the time
    # of pinning; `docker buildx imagetools inspect pgvector/pgvector:0.8.6-pg16`
    # prints the digest to move it to.
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: rebasis
          POSTGRES_PASSWORD: rebasis
          POSTGRES_DB: rebasis_test
        ports:
          - 5432:5432
        # Without a health check the job races the server's first start and the
        # first connection is refused rather than slow.
        options: >-
          --health-cmd "pg_isready -U rebasis -d rebasis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REBASIS_TEST_POSTGRES: postgresql://rebasis:rebasis@127.0.0.1:5432/rebasis_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Distinct per job: parallel jobs sharing one key raced to
          # reserve it, and the losers logged a failed cache save.
          cache-suffix: coverage
      - run: uv sync --all-extras --no-group spike
      - name: measure
        # `fail_under` in pyproject enforces the overall floor. The per-module
        # ones need the finished report, which is why the check below is a
        # script and not a test: a test reading coverage.json runs inside the
        # session that writes it, so it can only see the previous run's numbers.
        #
        # `not perf` as well as `not network`. The perf layer asserts timing,
        # and a shared runner cannot measure timing: this job failed twice on
        # `test_batching_amortises_the_per_call_cost`, by 1% and by 2.6%, which
        # is noise wearing a red X. ADR 11 already says absolute numbers belong
        # on a fixed runner — so do the ratios. The whole layer runs on the
        # project's own host, which is the machine its numbers describe.
        #
        # `memory` is deliberately NOT excluded, and that is why the marker
        # exists. Excluding the timing assertions used to exclude the
        # peak-allocation ones along with them, because both wore `perf` — so
        # the `O(batch x d)` invariant, the one guard against a
        # `list(iter_records())` that fails only on corpora nobody has in
        # development, gated nothing, while `benchmarks/README.md` went on
        # saying it gated every pull request. `tracemalloc` does not care how
        # loaded the runner is. This job is where that invariant is enforced.
        #
        # `-rs` and the grep for skips carry over from the job this replaced: a
        # backend test that opens with `pytest.importorskip` reports the same
        # green summary whether it ran or was never installed, and that is how
        # this suite once lied about covering five stores.
        run: |
          set -o pipefail
          uv run pytest -m "not network and not perf" -q -rs \
            --cov=rebasis --cov-report=json:reports/coverage.json | tee /tmp/results.txt
          if grep -qiE "SKIPPED.*(not installed|extra )" /tmp/results.txt; then
            echo "::error::a backend was skipped for a missing dependency"
            grep -iE "SKIPPED.*(not installed|extra )" /tmp/results.txt
            exit 1
          fi
      - name: the modules where a bug costs data
        run: uv run python tools/check_coverage_floors.py

  no-torch:
    name: core install (${{ matrix.os }})
    timeout-minutes: 15
    # **Two operating systems, and this is the job that can carry the second
    # one.** The macOS leg was removed from the full suite because `faiss-cpu`
    # and `torch` each link their own OpenMP runtime there and a process holding
    # both aborts before either does any work — so it could not finish, and what
    # was lost with it was coverage of the storage layer, which is exactly where
    # the platforms differ (directory fsync, `os.replace`, a system sqlite3 that
    # cannot load extensions) and exactly where a bug costs data rather than
    # accuracy.
    #
    # A core-only install has neither library, so the conflict cannot arise. That
    # makes this job the one place a second OS is free: it was already installing
    # nothing optional, for its own unrelated reason.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Distinct per job: parallel jobs sharing one key raced to
          # reserve it, and the losers logged a failed cache save.
          cache-suffix: no-torch-${{ matrix.os }}
      - name: install the core package only
        # No extras at all: this is what `pip install rebasis` gives a user.
        run: |
          uv venv --python 3.12
          uv pip install -e .
          uv pip install pytest pytest-randomly hypothesis
      - name: nothing optional leaked in
        run: |
          uv run python - <<'PY'
          import importlib.util as util
          for package in ("torch", "opentelemetry", "sentence_transformers"):
              assert util.find_spec(package) is None, f"{package} was pulled in by the core install"
          print("core install is clean")
          PY
      - name: the suite passes without them
        # `.venv/bin/pytest`, not `uv run`: inside a project `uv run` syncs the
        # environment from uv.lock first, which replaces the core-only install
        # this job exists to test.
        run: .venv/bin/pytest -m "unit or property or contract" -q

  lowest-direct:
    name: lowest direct dependencies
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Same service as the coverage job, for the reason the comment there gives
    # and one more: the `pg8000` floor is found by running the suite against
    # it, the way the chroma, qdrant and faiss floors were. A lower bound
    # nothing runs against is a guess with a version number on it.
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: rebasis
          POSTGRES_PASSWORD: rebasis
          POSTGRES_DB: rebasis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rebasis -d rebasis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REBASIS_TEST_POSTGRES: postgresql://rebasis:rebasis@127.0.0.1:5432/rebasis_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Distinct per job: parallel jobs sharing one key raced to
          # reserve it, and the losers logged a failed cache save.
          cache-suffix: lowest-direct
      - name: resolve to the declared lower bounds
        # An untested lower bound is the most common way a package ends
        # up not working on the versions it claims to support.
        run: |
          uv venv --python 3.12
          uv pip install -e ".[chroma,lancedb,qdrant,sqlite-vec,faiss,pgvector]" \
            --resolution lowest-direct
          uv pip install pytest pytest-randomly hypothesis
      - name: the floors hold
        # `.venv/bin/pytest`, not `uv run`: `uv run` would sync from uv.lock and
        # test the pinned versions instead of the declared floors — which is how
        # three wrong lower bounds survived in `[project.optional-dependencies]`.
        run: .venv/bin/pytest -m "unit or contract" -q

  docs:
    name: docs build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Distinct per job: parallel jobs sharing one key raced to
          # reserve it, and the losers logged a failed cache save.
          cache-suffix: docs
      - name: build the site in strict mode
        # Strict: a dead link is a build failure. Documentation that points at
        # a page that no longer exists is worse than documentation that stops.
        run: uv run --group docs mkdocs build

  secrets:
    name: secret scan
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: gitleaks
        # The pre-commit hook covers local commits; a fork's PR never runs it,
        # so CI has to.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: dependency review
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Pull requests only: the action compares a base ref against a head ref, and
    # there is nothing to compare on a push to `main`.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: what this change introduces
        # The gap Dependabot leaves. Dependabot reacts once an advisory exists
        # for something already merged; this asks whether *this change* adds a
        # dependency that is already known-vulnerable, before it is merged. Free
        # on a public repository — GitHub Advanced Security is only required for
        # private repositories in an organisation.
        #
        # `deny-licenses` names the copyleft families that would make this
        # package unusable inside the commercial products it is meant to sit in.
        # Apache-2.0 says what rebasis promises; a GPL dependency arriving through
        # a transitive bump would quietly withdraw that promise, and a legal
        # review finding it is far more expensive than this job finding it.
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
          comment-summary-in-pr: on-failure
