# rebasis documentation site
#
# Two rules govern what is here.
#
# **Generated pages are never hand-edited.** errors.md, events.md and
# profiles.md come from `just docs-gen`, and CI fails if they are stale. A
# catalogue that lies is worse than none.
#
# **The site does not phone anywhere.** No analytics, no external fonts, no
# tracking. rebasis is a tool for people who keep their corpus local; a docs
# site that reports who read which page contradicts that.

site_name: rebasis
site_description: >-
  Measure whether an embedding upgrade is worth it, bridge it without reindexing when it is, and migrate safely when you are ready.
site_url: https://batuhanzorbeyzengin.github.io/rebasis/
repo_url: https://github.com/batuhanzorbeyzengin/rebasis
repo_name: batuhanzorbeyzengin/rebasis
edit_uri: edit/main/docs/
copyright: Apache-2.0

docs_dir: docs
site_dir: site

exclude_docs: |
  # Gitignored: the design document. It carries real host details and is
  # local to the maintainer's machine.
  _local/
  design/
  # Fragment instructions, not a page.
  ../changelog.d/
  # The citation manifest is input to `tools/check_citations.py`, not a page.
  # Left in, mkdocs copies it into the site as a static asset at /citations.toml.
  citations.toml

theme:
  name: material
  # Bundled with the theme rather than fetched from Google Fonts: the site
  # must not make a request on the reader's behalf.
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  # The roadmap lives at the repository root, where GitHub surfaces it.
  # Linked rather than copied: two files saying the same thing drift.
  - Roadmap: https://github.com/batuhanzorbeyzengin/rebasis/blob/main/ROADMAP.md
  - Concepts:
      - What drift is: concepts/drift.md
      - Adapters: concepts/adapters.md
      - The decision rule: concepts/decision-rule.md
  - Related work: related-work.md
  - Guides:
      - Chroma: guides/chroma.md
      - LanceDB: guides/lancedb.md
      - Migration and rollback: guides/migration.md
      - LangChain and LlamaIndex: guides/langchain.md
  - Reference:
      - CLI: reference/cli.md
      - Error codes: reference/errors.md
      - Events: reference/events.md
      - Encoding profiles: reference/profiles.md
      - API: reference/api.md
  - Measurements:
      - M0 — the spike: m0-findings.md
      - M4 — memory and budgets: m4-findings.md
      - Golden corpora — the first real evidence: golden-findings.md
      - When bridging is worth it: bridge-band.md
      - The bridge as a recall stage: cascade-band.md
      - What a migration does to the index: index-health.md
      - Merging two spaces during a migration: mixed-space-fusion.md
      - What a completed migration is worth: migration-band.md
      - Against a published result: vs-drift-adapter.md
  - Development:
      - Setup: development/setup.md
      - Testing: development/testing.md
      - Performance: development/performance.md
      - Releasing: development/release.md
  - Decisions:
      - Overview: adr/README.md
      - 1. Mean centering by default: adr/0001-mean-centering-by-default.md
      - 2. CSLS is a candidate: adr/0002-csls-is-a-candidate.md
      - 3. The borderline band: adr/0003-borderline-band-width.md
      - 4. ARR's ratio interval: adr/0004-arr-ratio-interval.md
      - 5. Comparing against doing nothing: adr/0005-compare-against-doing-nothing.md
      - 6. No GPU threshold for kNN: adr/0006-no-gpu-threshold-for-knn.md
      - 7. Tamper-evident, not tamper-proof: adr/0007-audit-is-tamper-evident.md
      - 8. T0 and the query encoding: adr/0008-t0-cannot-see-the-query-encoding.md
      - 9. The break-even decides: adr/0009-the-break-even-decides.md
      - 10. Retention is bounded by the source: adr/0010-retention-is-bounded-by-the-source.md
      - 11. The hot-path budget is per dimension: adr/0011-the-hot-path-budget-is-per-dimension.md

# A dead link in the docs is a bug, not a warning.
strict: true

watch:
  - src/rebasis
